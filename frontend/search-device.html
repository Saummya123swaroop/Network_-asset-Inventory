<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Device | DVC Network Asset Inventory</title>
<link rel="stylesheet" href="search-device.css">
</head>
<body>

  <div class="scene">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="gridLine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4fd8ff" stop-opacity="0"/>
          <stop offset="50%" stop-color="#4fd8ff" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#4fd8ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g stroke="#1c3660" stroke-width="2" fill="none" opacity="0.7">
        <path d="M120 900 L160 620 L200 900"/>
        <path d="M100 700 L220 700"/>
        <path d="M110 650 L210 650"/>
        <path d="M90 750 L230 750"/>
        <path d="M1240 900 L1280 600 L1320 900"/>
        <path d="M1215 680 L1345 680"/>
        <path d="M1225 630 L1335 630"/>
      </g>
      <g stroke="url(#gridLine)" stroke-width="1.5">
        <line x1="0" y1="640" x2="1440" y2="660"/>
        <line x1="0" y1="700" x2="1440" y2="715"/>
        <line x1="0" y1="760" x2="1440" y2="770"/>
      </g>
      <g fill="#0e1c36" opacity="0.8">
        <rect x="300" y="520" width="34" height="200"/>
        <rect x="340" y="470" width="26" height="250"/>
        <rect x="372" y="550" width="40" height="170"/>
        <rect x="418" y="500" width="22" height="220"/>
        <rect x="1000" y="540" width="30" height="180"/>
        <rect x="1035" y="490" width="24" height="230"/>
        <rect x="1064" y="560" width="36" height="160"/>
      </g>
      <g fill="#4fd8ff" opacity="0.5">
        <circle cx="317" cy="540" r="1.4"/>
        <circle cx="353" cy="500" r="1.4"/>
        <circle cx="392" cy="580" r="1.4"/>
        <circle cx="1015" cy="560" r="1.4"/>
        <circle cx="1047" cy="520" r="1.4"/>
      </g>
    </svg>
  </div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <img src="dvc-logo.png" alt="DVC logo">
      </div>
      <div class="brand-text">
        <div class="title">Asset Lookup</div>
      </div>
    </div>
    <a href="../dashboard/dashboard.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Dashboard
    </a>
  </div>

  <div class="content">
    <div class="page-head">
      <h1>Search Device</h1>
      <p>Look up any device by IP address, , or device type — results update instantly</p>
    </div>

    <div class="search-panel">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search by IP address, device type..." autofocus>
        <button class="clear-btn" id="clearBtn" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="search-hints">
        <span class="hint-label">Try:</span>
        <span class="hint-chip" data-query="192.168.5.1">192.168.5.1</span>
        <span class="hint-chip" data-query="Firewall">Firewall</span>
        <span class="hint-chip" data-query="Server Room">Server Room</span>
      </div>
    </div>

    <div class="results-meta">
      <span id="resultsCount">Showing <strong>all</strong> devices</span>
    </div>

    <div class="panel">
      <div class="table-scroll">
        <table id="deviceTable">
          <thead>
            <tr>
              <th>Device</th>
              <th>IP Address</th>
              <th>MAC Address</th>
              <th>Location</th>
              <th>Type</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <h3>No devices found</h3>
        <p>Try a different IP address, device type.</p>
      </div>
    </div>
  </div>
</body>
,<script src="search-device.js"></script>
</html>
