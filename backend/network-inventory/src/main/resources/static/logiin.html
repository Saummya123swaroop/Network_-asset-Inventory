```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DVC Network Asset Inventory - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(5, 15, 35, 0.72),

<body>

    <div class="login-container">

        <!-- ================= LOGIN SECTION ================= -->

        <div id="loginSection">

            <div class="logo">
                <img src="dvc-logo.png" alt="DVC Logo">
            </div>

            <div class="title">
                Network Asset Inventory
            </div>

            <div class="subtitle">
                DVC Power Plant
            </div>


            <!-- Login error -->

            <div
                id="loginError"
                class="error-message"
                style="display:none;"
            >
                Invalid username or password.
            </div>


            <form
                action="/login"
                method="post"
            >

                <div class="field">

                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <div class="register-area">

                Don't have an account?

                <a onclick="showRegister()">
                    Register
                </a>

            </div>

        </div>


        <!-- ================= REGISTER SECTION ================= -->

        <div
            id="registerSection"
            class="register-form"
        >

            <div class="logo">
                <img src="dvc-logo.png" alt="DVC Logo">
            </div>

            <div class="title">
                Create Account
            </div>

            <div class="subtitle">
                Network Asset Inventory
            </div>


            <div
                id="registerMessage"
                style="display:none;"
            ></div>


            <form id="registerForm">

                <div class="field">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Choose a password"
                        required
                    >

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Register
                </button>

            </form>


            <span
                class="back-login"
                onclick="showLogin()"
            >
                ← Back to Login
            </span>

        </div>


        <div class="footer">
            Network Asset Inventory & Documentation System
        </div>

    </div>


    <script>

        // ==========================================
        // SHOW REGISTER
        // ==========================================

        function showRegister() {

            document.getElementById(
                "loginSection"
            ).style.display = "none";

            document.getElementById(
                "registerSection"
            ).style.display = "block";
        }


        // ==========================================
        // SHOW LOGIN
        // ==========================================

        function showLogin() {

            document.getElementById(
                "registerSection"
            ).style.display = "none";

            document.getElementById(
                "loginSection"
            ).style.display = "block";
        }


        // ==========================================
        // CHECK LOGIN ERROR
        // ==========================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        if (params.get("error") === "true") {

            document.getElementById(
                "loginError"
            ).style.display = "block";
        }


        // ==========================================
        // REGISTER USER
        // ==========================================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById(
                                "registerUsername"
                            )
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById(
                                "registerPassword"
                            )
                            .value;


                    const confirmPassword =
                        document
                            .getElementById(
                                "confirmPassword"
                            )
                            .value;


                    const message =
                        document.getElementById(
                            "registerMessage"
                        );


                    // Check password

                    if (
                        password !==
                        confirmPassword
                    ) {

                        message.style.display =
                            "block";

                        message.className =
                            "error-message";

                        message.textContent =
                            "Passwords do not match.";

                        return;
                    }


                    if (
                        username.length < 3
                    ) {

                        message.style.display =
                            "block";

                        message.className =
                            "error-message";

                        message.textContent =
                            "Username must contain at least 3 characters.";

                        return;
                    }


                    if (
                        password.length < 6
                    ) {

                        message.style.display =
                            "block";

                        message.className =
                            "error-message";

                        message.textContent =
                            "Password must contain at least 6 characters.";

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                "/api/auth/register",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username:
                                                username,

                                            password:
                                                password
                                        })
                                }
                            );


                        const result =
                            await response.text();


                        if (!response.ok) {

                            throw new Error(
                                result ||
                                "Registration failed."
                            );
                        }


                        message.style.display =
                            "block";

                        message.className =
                            "success-message";

                        message.textContent =
                            "Registration successful! You can now login.";


                        document
                            .getElementById(
                                "registerForm"
                            )
                            .reset();


                        setTimeout(
                            showLogin,
                            1500
                        );

                    }

                    catch (error) {

                        message.style.display =
                            "block";

                        message.className =
                            "error-message";

                        message.textContent =
                            error.message;
                    }

                }
            );

    </script>

</body>

</html>
