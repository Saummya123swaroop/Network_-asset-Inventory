<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Device | DVC Network Asset Inventory</title>

    <link rel="stylesheet" href="/add-device.css">
</head>

<body>

    <!-- ================= TOP BAR ================= -->

    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                <img src="/dvc-logo.png" alt="DVC logo">
            </div>

            <div class="brand-text">
                <div class="title">ADD ASSET
                </div>
            </div>

        </div>

        <a href="/dashboard.html" class="back-link">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>

            </svg>

            Back to Dashboard

        </a>

    </div>


    <!-- ================= PAGE CONTENT ================= -->

    <div class="content">

        <div class="page-head">

            <h1>Add Device</h1>

            <p>
                Enter the device details below to register it in the network inventory
            </p>

        </div>


        <!-- ================= FORM ================= -->

        <form class="form-panel" id="addDeviceForm">


            <!-- ================= DEVICE IDENTITY ================= -->

            <div class="form-section-title">
                Device Identity
            </div>


            <div class="form-grid">


                <!-- DEVICE NAME -->

                <div class="field">

                    <input
                        type="text"
                        id="deviceName"
                        placeholder=" "
                        required
                    >

                    <label for="deviceName">
                        Device Name
                    </label>

                </div>


                <!-- DEVICE TYPE -->

                <div class="field select-field">

                    <select
                        id="deviceType"
                        required
                    >

                        <option value="" selected disabled>
                            Select device type
                        </option>

                        <option value="Router">
                            Router
                        </option>

                        <option value="Switch">
                            Switch
                        </option>

                        <option value="Firewall">
                            Firewall
                        </option>

                        <option value="Server">
                            Server
                        </option>

                        <option value="PLC">
                            PLC
                        </option>

                        <option value="Access Point">
                            Access Point
                        </option>

                    </select>

                    <svg class="chevron"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="m6 9 6 6 6-6"/>

                    </svg>

                </div>

            </div>


            <!-- ================= NETWORK DETAILS ================= -->

            <div class="form-section-title">
                Network Details
            </div>


            <div class="form-grid">


                <!-- IP ADDRESS -->

                <div class="field">

                    <input
                        type="text"
                        id="ipAddress"
                        placeholder=" "
                        inputmode="numeric"
                        required
                    >

                    <label for="ipAddress">
                        IP Address
                    </label>

                    <span class="hint">
                        e.g. 192.168.1.1
                    </span>

                </div>


                <!-- MAC ADDRESS -->

                <div class="field">

                    <input
                        type="text"
                        id="macAddress"
                        placeholder=" "
                        maxlength="17"
                        required
                    >

                    <label for="macAddress">
                        MAC Address
                    </label>

                    <span class="hint">
                        Auto-formats as XX:XX:XX:XX:XX:XX
                    </span>

                </div>


                <!-- LOCATION -->

                <div class="field full">

                    <input
                        type="text"
                        id="location"
                        placeholder=" "
                        required
                    >

                    <label for="location">
                        Location
                    </label>

                </div>

            </div>


            <!-- ================= STATUS ================= -->

            <div class="form-section-title">
                Status &amp; Maintenance
            </div>


            <div class="form-grid">


                <!-- MAINTENANCE DATE -->

                <div class="field">

                    <input
                        type="date"
                        id="maintenanceDate"
                    >

                    <label for="maintenanceDate">
                        Last Maintenance Date
                    </label>

                </div>


                <!-- STATUS -->

                <div class="field select-field">

                    <select
                        id="status"
                        required
                    >

                        <option value="" selected disabled>
                            Select status
                        </option>

                        <option value="Active">
                            Active
                        </option>

                        <option value="Maintenance">
                            Under Maintenance
                        </option>

                        <option value="Offline">
                            Offline
                        </option>

                    </select>

                    <svg class="chevron"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="m6 9 6 6 6-6"/>

                    </svg>

                    <span
                        class="status-preview hidden"
                        id="statusPreview"
                    >
                        Active
                    </span>

                </div>

            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="form-actions">

                <button
                    type="reset"
                    class="btn btn-secondary"
                >
                    Clear
                </button>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M12 5v14"/>
                        <path d="M5 12h14"/>

                    </svg>

                    Add Device

                </button>

            </div>

        </form>

    </div>


    <!-- ================= TOAST ================= -->

    <div class="toast" id="toast">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <path d="m9 12 2 2 4-4"/>
            <circle cx="12" cy="12" r="9"/>

        </svg>

        <span id="toastText">
            Device added successfully
        </span>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>
    alert("ADD DEVICE PAGE JAVASCRIPT IS RUNNING");
</script>

<script src="/add-device.js"></script>

</body>
</html>
